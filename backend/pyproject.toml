[project]
name = "quiver-backend"
version = "0.1.0"
description = "Curated, governed virtual MCP servers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "motor>=3.5",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "python-jose[cryptography]>=3.3",
  "bcrypt>=4.1",
  "cryptography>=43",
  "httpx>=0.27",
  "mcp>=1.10,<2",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "mongomock-motor>=0.0.34",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
# B008: FastAPI's Depends(...) in defaults is the framework's idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
